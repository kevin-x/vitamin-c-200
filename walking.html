<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비타민C 200회 기념 걷기 이벤트</title>
<style>
  :root{
    --bg:#FFF6E9;
    --card:#ffffff;
    --line:#F0E0C3;
    --text:#2B2116;
    --sub:#8B7355;
    --accent:#FFD93D;
    --accent2:#B5603D;
    --mint:#FFFCF6;
    --dark:#2B1B12;
    --gold:#FFD93D;
    --silver:#D9C2A0;
    --bronze:#B5603D;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:linear-gradient(180deg,#FFF9EF 0%,#FFF1D8 100%);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  body{padding:18px}
  .wrap{max-width:960px;margin:0 auto}

  .home-btn{position:fixed;top:14px;left:14px;z-index:50;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--dark);color:var(--accent);font-size:14px;font-weight:800;text-decoration:none;box-shadow:0 6px 16px rgba(43,27,18,.25)}
  .home-btn:active{transform:scale(.97)}

  .poster{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 14px 36px rgba(90,60,20,.1)}
  .hero{padding:34px 28px 24px;background:
      radial-gradient(circle at top left, #FFFDF8 0, #FFFDF8 32%, transparent 33%),
      radial-gradient(circle at top right, #FFFDF8 0, #FFFDF8 32%, transparent 33%),
      linear-gradient(180deg,#FFF8E7 0%,#FFEFCE 100%);
    border-bottom:1px solid var(--line);
    text-align:center;position:relative}
  .leaf{position:absolute;font-size:22px;opacity:.65}
  .leaf.l1{left:28px;top:18px}.leaf.l2{right:30px;top:22px}.leaf.l3{left:90px;bottom:18px}.leaf.l4{right:85px;bottom:18px}
  .title{font-size:44px;line-height:1.12;font-weight:900;letter-spacing:-2px;color:var(--dark);margin:0}
  .title small{display:block;color:var(--accent2);font-size:32px;margin-top:6px}
  .badge{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:999px;background:var(--dark);color:var(--accent);font-size:28px;font-weight:900;letter-spacing:-1px}
  .date{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:999px;background:#FFF1C6;color:#6B4F1D;font-size:22px;font-weight:800}
  .meta{margin-top:14px;font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.6px}
  .submeta{margin-top:8px;font-size:24px;font-weight:800;color:var(--sub);line-height:1.5}
  .updated{margin-top:8px;font-size:14px;font-weight:700;color:var(--sub);opacity:.8}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:22px 24px}
  .stat{background:var(--mint);border:1px solid var(--line);border-radius:20px;padding:20px 18px;text-align:center}
  .stat .icon{font-size:34px;line-height:1;margin-bottom:10px}
  .stat .label{font-size:19px;color:var(--sub);font-weight:800}
  .leader-note{font-size:12px;font-weight:700;color:var(--sub);opacity:.75}
  .stat .value{font-size:46px;font-weight:900;letter-spacing:-1.5px;color:var(--dark);margin-top:6px}
  .stat .value small{font-size:27px}
  .stat.leader{background:linear-gradient(180deg,#FFFBEB 0%,#FFF1C6 100%)}
  .stat.leader .name{font-size:32px;font-weight:900;color:var(--dark);margin-top:2px}

  .section{padding:4px 24px 0}
  .section-title{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0 18px}
  .section-title span{background:linear-gradient(90deg,#FFD93D,#F0C030);color:var(--dark);padding:12px 24px;border-radius:999px;font-size:31px;font-weight:900;letter-spacing:-1px}
  .rank-list{padding:0 24px 24px}
  .photo-note{margin:0 24px 24px;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,#FFF1C6,#FFE7A8);border:1px solid #FFD93D;text-align:center;font-size:18px;font-weight:800;color:#6B4F1D;line-height:1.5}
  .row{display:grid;grid-template-columns:70px 150px 1fr 160px;gap:16px;align-items:center;padding:12px 6px;border-bottom:1px solid #F5E8D0}
  .row:last-child{border-bottom:0}
  .rank{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;font-size:21px;font-weight:900;color:var(--dark);margin:0 auto}
  .r1{background:var(--gold)} .r2{background:var(--silver)} .r3{background:var(--bronze);color:#fff}
  .rX{background:#F0E0C3;color:#6B4F1D}
  .rHost{background:var(--dark);color:var(--accent);font-size:20px}
  .name{font-size:31px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
  .bar{height:22px;background:#F5E8D0;border-radius:999px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
  .steps{text-align:right;font-size:32px;font-weight:900;letter-spacing:-1px;white-space:nowrap}

  .footer{padding:8px 24px 28px;text-align:center}
  .footer-box{border-radius:22px;background:linear-gradient(180deg,#2B1B12 0%,#3D2817 100%);padding:22px 18px;border:1px solid #2B1B12}
  .footer-main{font-size:40px;font-weight:900;letter-spacing:-1.5px;color:var(--accent)}
  .footer-sub{font-size:22px;color:#EDDFC9;font-weight:700;margin-top:8px;line-height:1.5}

  @media (max-width:900px){
    .title{font-size:34px}.title small{font-size:26px}.badge{font-size:24px}.meta{font-size:19px}.submeta{font-size:19px}.updated{font-size:12px}
    .stats{grid-template-columns:1fr}.stat .value{font-size:38px}
    .row{grid-template-columns:58px 106px 1fr 112px;gap:10px}.name{font-size:24px}.steps{font-size:24px}
    .section-title span{font-size:24px}
    .photo-note{font-size:15px}
    .footer-main{font-size:30px}.footer-sub{font-size:18px}
  }
</style>
</head>
<body>
<a class="home-btn" href="index.html">← 홈</a>
<div class="wrap">
  <section class="poster">
    <div class="hero">
      <div class="leaf l1">🍁</div><div class="leaf l2">🍁</div><div class="leaf l3">🍂</div><div class="leaf l4">🍂</div>
      <h1 class="title">비타민C 200회 기념<small>걷기 이벤트</small></h1>
      <div class="badge" id="heroBadge">2주차 중간 집계 현황</div><br>
      <div class="date" id="heroDate">2026. 10. 15 기준</div>
      <div class="meta" id="heroStatus">4주 챌린지 진행 중 · 현재 2주차 진행 중 · 17일 남음</div>
      <div class="submeta" id="heroPeriod">기간: 10월 5일 ~ 11월 1일</div>
      <div class="updated" id="dataUpdated"></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="icon">👥</div><div class="label">참가자</div><div class="value" id="statPeople"></div></div>
      <div class="stat"><div class="icon">👟</div><div class="label">누적 걸음</div><div class="value" id="statSteps"></div></div>
      <div class="stat leader"><div class="icon">👑</div><div class="label">현재 1위 <span class="leader-note">(Kevin은 제외)</span></div><div class="name" id="statLeaderName"></div><div class="value" id="statLeaderSteps" style="font-size:34px"></div></div>
    </div>

    <div class="section">
      <div class="section-title"><span>통합 순위</span></div>
    </div>
    <div class="rank-list" id="rankList"></div>

    <div class="photo-note">📸 오늘 걸은 거, 인증샷으로 자랑해요!<br>카페에 한 컷 남기면 선물이 팡팡 터집니다 🎁</div>

    <div class="footer">
      <div class="footer-box">
        <div class="footer-main" id="footerMain">남은 17일도 함께 걸어요!</div>
        <div class="footer-sub">매일 한 걸음씩, 200회의 울림을 완성해 봅시다.</div>
      </div>
    </div>
  </section>
</div>

<script id="initial-data" type="application/json">{
  "startISO":"2026-10-05",
  "endISO":"2026-11-01",
  "start":"10월 5일",
  "end":"11월 1일",
  "participants":[
    {"name":"Kevin","steps":395827,"app":"both"},
    {"name":"알즈","steps":292780,"app":"android"},
    {"name":"자스민","steps":280828,"app":"android"},
    {"name":"써니","steps":223136,"app":"android"},
    {"name":"그레이스","steps":262122,"app":"android"},
    {"name":"태형","steps":197500,"app":"iphone"},
    {"name":"헤이","steps":149000,"app":"iphone","hidden":true},
    {"name":"Cool","steps":164573,"app":"android"},
    {"name":"케이","steps":136337,"app":"android"},
    {"name":"에스더","steps":223952,"app":"android"},
    {"name":"엘리오","steps":95072,"app":"android"}
  ],
  "dataUpdatedAt":"10월 29일 05시"
}</script>
<script>
(() => {
  const fmt = new Intl.NumberFormat('ko-KR');
  const $ = s => document.querySelector(s);
  let data = JSON.parse($('#initial-data').textContent);
  const sorted = () => data.participants.filter(p=>!p.hidden).sort((a,b)=>b.steps-a.steps);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function formatDate(d){
    return d.getFullYear() + '. ' + (d.getMonth()+1) + '. ' + d.getDate();
  }

  function challengeStatus(){
    const msPerDay = 86400000;
    const start = new Date(data.startISO + 'T00:00:00');
    const end = new Date(data.endISO + 'T00:00:00');
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const dateText = formatDate(today) + ' 기준';

    if (today < start) {
      const dDay = Math.ceil((start - today) / msPerDay);
      return { dateText, statusText: `챌린지 시작까지 D-${dDay}`, footerMain: `D-${dDay}, 곧 함께 걸어요!` };
    }
    if (today > end) {
      return { dateText, statusText: '4주 챌린지 종료', footerMain: '모두 수고하셨어요, 200회의 울림!' };
    }
    const dayIndex = Math.floor((today - start) / msPerDay) + 1;
    const week = Math.ceil(dayIndex / 7);
    const daysLeft = Math.floor((end - today) / msPerDay);
    if (daysLeft <= 0) {
      return { dateText, statusText: `4주 챌린지 진행 중 · 현재 ${week}주차 진행 중 · 오늘 마지막 날`, footerMain: '오늘이 마지막 날이에요! 끝까지 함께 걸어요!' };
    }
    return { dateText, statusText: `4주 챌린지 진행 중 · 현재 ${week}주차 진행 중 · ${daysLeft}일 남음`, footerMain: `남은 ${daysLeft}일도 함께 걸어요!` };
  }

  function render(){
    const people = sorted();
    const total = data.participants.reduce((sum,p)=>sum + Number(p.steps||0), 0);
    const maxSteps = people[0].steps;
    const displayLeader = people.find(p => p.name !== 'Kevin') || people[0];
    const ch = challengeStatus();

    $('#heroDate').textContent = ch.dateText;
    $('#heroStatus').textContent = ch.statusText;
    $('#footerMain').textContent = ch.footerMain;
    $('#heroPeriod').innerHTML = '기간: ' + data.start + ' ~ ' + data.end;
    $('#dataUpdated').textContent = data.dataUpdatedAt ? ('⏱ 걸음 데이터 업데이트: ' + data.dataUpdatedAt + ' 기준') : '';
    $('#statPeople').innerHTML = fmt.format(people.length) + '<small>명</small>';
    $('#statSteps').innerHTML = fmt.format(total) + '<small>보</small>';
    $('#statLeaderName').textContent = displayLeader.name;
    $('#statLeaderSteps').innerHTML = fmt.format(displayLeader.steps) + '<small>보</small>';

    const others = people.filter(p => p.name !== 'Kevin');

    $('#rankList').innerHTML = people.map((p)=>{
      const pct = maxSteps > 0 ? Math.max(2, Math.round((p.steps/maxSteps)*100)) : 0;
      const isKevin = p.name === 'Kevin';
      const rankIdx = isKevin ? -1 : others.indexOf(p);
      const cls = isKevin ? 'rHost' : (rankIdx===0?'r1':rankIdx===1?'r2':rankIdx===2?'r3':'rX');
      const rankLabel = isKevin ? '👑' : (rankIdx+1);
      return `
        <div class="row">
          <div class="rank ${cls}">${rankLabel}</div>
          <div class="name">${esc(p.name)}</div>
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
          <div class="steps">${fmt.format(p.steps)}보</div>
        </div>`;
    }).join('');
  }

  render();
})();
</script>
</body>
</html>
