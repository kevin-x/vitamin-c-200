<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마니또 찾기 · 비타민C 200회</title>
<style>
  :root{
    --bg:#FFF6E9;
    --card:#ffffff;
    --line:#F0E0C3;
    --text:#2B2116;
    --sub:#8B7355;
    --accent:#FFD93D;
    --accent2:#B5603D;
    --mint:#FFFCF6;
    --dark:#2B1B12;
    --danger:#C0392B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:linear-gradient(180deg,#FFF9EF 0%,#FFF1D8 100%);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  body{padding:18px}
  .wrap{max-width:560px;margin:0 auto}

  .home-btn{position:fixed;top:14px;left:14px;z-index:50;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--dark);color:var(--accent);font-size:14px;font-weight:800;text-decoration:none;box-shadow:0 6px 16px rgba(43,27,18,.25)}
  .home-btn:active{transform:scale(.97)}

  .poster{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 14px 36px rgba(90,60,20,.1)}
  .hero{padding:46px 28px 26px;background:
      radial-gradient(circle at top left, #FFFDF8 0, #FFFDF8 32%, transparent 33%),
      radial-gradient(circle at top right, #FFFDF8 0, #FFFDF8 32%, transparent 33%),
      linear-gradient(180deg,#FFF8E7 0%,#FFEFCE 100%);
    border-bottom:1px solid var(--line);
    text-align:center;position:relative}
  .leaf{position:absolute;font-size:20px;opacity:.6}
  .leaf.l1{left:26px;top:16px}.leaf.l2{right:28px;top:20px}
  .gift{font-size:40px;line-height:1}
  .title{font-size:32px;line-height:1.25;font-weight:900;letter-spacing:-1px;color:var(--dark);margin:10px 0 0}
  .badge{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:999px;background:var(--dark);color:var(--accent);font-size:14px;font-weight:800;letter-spacing:-.3px}

  /* pick step */
  .pick{padding:30px 24px 28px}
  .pick-title{text-align:center;font-size:18px;font-weight:800;color:var(--text);margin-bottom:16px}
  .name-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .name-btn{padding:16px 10px;border-radius:16px;border:2px solid var(--line);background:var(--mint);color:var(--text);font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;transition:all .15s}
  .name-btn.active{border-color:var(--accent2);background:linear-gradient(180deg,#FFFBEB 0%,#FFF1C6 100%);color:var(--dark)}

  .pin-area{margin-top:22px;display:none}
  .pin-area.show{display:block}
  .pin-label{text-align:center;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:10px}
  .pin-input{display:block;width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--mint);color:var(--dark);font-size:24px;font-weight:800;letter-spacing:10px;text-align:center;font-family:inherit}
  .pin-input:focus{outline:none;border-color:var(--accent2)}
  .pin-error{margin-top:10px;text-align:center;font-size:14px;font-weight:800;color:var(--danger);display:none}
  .pin-error.show{display:block}

  .reveal-btn{display:block;width:100%;margin-top:18px;padding:16px;border:none;border-radius:999px;background:var(--line);color:var(--sub);font-size:17px;font-weight:900;font-family:inherit;cursor:not-allowed;transition:all .15s}
  .reveal-btn.ready{background:var(--dark);color:var(--accent);cursor:pointer}
  .reveal-btn.ready:active{transform:scale(.98)}

  /* result step */
  .result{padding:36px 28px 28px;text-align:center}
  .result-label{font-size:16px;font-weight:700;color:var(--sub)}
  .result-name{margin-top:10px;font-size:46px;font-weight:900;letter-spacing:-1.5px;color:var(--accent2)}
  .result-sub{margin-top:10px;font-size:14px;color:var(--sub);font-weight:700}

  .rules{margin-top:28px;display:flex;flex-direction:column;gap:12px;text-align:left}
  .rule{display:flex;gap:14px;align-items:flex-start;background:var(--mint);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
  .rule-icon{font-size:26px;line-height:1}
  .rule-text{font-size:15px;line-height:1.6;color:var(--text);font-weight:600}
  .rule-text strong{color:var(--accent2)}

  .reset-btn{display:inline-block;margin-top:24px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--sub);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}

  [hidden]{display:none !important}

  @media (max-width:480px){
    .title{font-size:27px}
    .result-name{font-size:38px}
  }
</style>
</head>
<body>
<a class="home-btn" href="index.html">← 홈</a>
<div class="wrap">
  <section class="poster">
    <div class="hero">
      <div class="leaf l1">🍁</div><div class="leaf l2">🍂</div>
      <div class="gift">🎁</div>
      <h1 class="title">두근두근<br>마니또</h1>
      <div class="badge">1박2일 여행 · 마니또 이벤트</div>
    </div>

    <div id="pickStep" class="pick">
      <div class="pick-title">당신은 누구인가요?</div>
      <div class="name-grid" id="nameGrid"></div>

      <div class="pin-area" id="pinArea">
        <div class="pin-label">본인에게만 전달된 4자리 PIN을 입력하세요</div>
        <input class="pin-input" id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••">
        <div class="pin-error" id="pinError">PIN이 올바르지 않습니다. 다시 확인해주세요.</div>
      </div>

      <button id="revealBtn" class="reveal-btn">내 마니또 확인하기</button>
    </div>

    <div id="resultStep" class="result" hidden>
      <div class="result-label">당신의 마니또는</div>
      <div class="result-name" id="resultName"></div>
      <div class="result-sub">지금부터 우리만의 비밀이에요 🤫</div>

      <div class="rules">
        <div class="rule">
          <div class="rule-icon">🎁</div>
          <div class="rule-text"><strong>여행 2일째 아침</strong>, 마니또를 위한 선물과 손편지를 준비하세요</div>
        </div>
        <div class="rule">
          <div class="rule-icon">💛</div>
          <div class="rule-text">여행 내내 마니또에게 <strong>최선을 다해 친절</strong>을 베푸세요</div>
        </div>
      </div>

      <button id="resetBtn" class="reset-btn">다른 사람으로 다시 확인</button>
    </div>
  </section>
</div>

<script>
(() => {
  const ENC = JSON.parse(document.getElementById('manito-data').textContent);
  const NAMES = Object.keys(ENC);
  const $ = s => document.querySelector(s);
  const LAST_NAME_KEY = 'vitaminc_manito_lastname';

  const nameGrid = $('#nameGrid');
  const pinArea = $('#pinArea');
  const pinInput = $('#pinInput');
  const pinError = $('#pinError');
  const revealBtn = $('#revealBtn');
  const pickStep = $('#pickStep');
  const resultStep = $('#resultStep');
  const resultName = $('#resultName');
  const resetBtn = $('#resetBtn');

  let selected = null;

  function b64ToBytes(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function updateReadyState(){
    const ready = !!selected && pinInput.value.length === 4;
    revealBtn.classList.toggle('ready', ready);
  }

  NAMES.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'name-btn';
    btn.type = 'button';
    btn.textContent = name;
    btn.addEventListener('click', () => {
      selected = name;
      [...nameGrid.children].forEach(b => b.classList.toggle('active', b === btn));
      pinArea.classList.add('show');
      pinError.classList.remove('show');
      pinInput.value = '';
      pinInput.focus();
      updateReadyState();
    });
    nameGrid.appendChild(btn);
  });

  pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
    pinError.classList.remove('show');
    updateReadyState();
  });

  async function decrypt(name, pin){
    const rec = ENC[name];
    if (!rec) return null;
    const salt = b64ToBytes(rec.salt);
    const iv = b64ToBytes(rec.iv);
    const ct = b64ToBytes(rec.ct);
    const enc = new TextEncoder();
    try {
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const ptBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
      return new TextDecoder().decode(ptBuf);
    } catch (e) {
      return null;
    }
  }

  function showResult(plain, name){
    resultName.textContent = plain;
    localStorage.setItem(LAST_NAME_KEY, name);
    pickStep.hidden = true;
    resultStep.hidden = false;
  }

  revealBtn.addEventListener('click', async () => {
    if (!selected || pinInput.value.length !== 4) return;
    revealBtn.disabled = true;
    const plain = await decrypt(selected, pinInput.value);
    revealBtn.disabled = false;
    if (plain === null) {
      pinError.classList.add('show');
      pinInput.value = '';
      pinInput.focus();
      updateReadyState();
      return;
    }
    showResult(plain, selected);
  });

  resetBtn.addEventListener('click', () => {
    localStorage.removeItem(LAST_NAME_KEY);
    selected = null;
    pinInput.value = '';
    [...nameGrid.children].forEach(b => b.classList.remove('active'));
    pinArea.classList.remove('show');
    pinError.classList.remove('show');
    revealBtn.classList.remove('ready');
    resultStep.hidden = true;
    pickStep.hidden = false;
  });

  const lastName = localStorage.getItem(LAST_NAME_KEY);
  if (lastName && ENC[lastName]) {
    const btn = [...nameGrid.children].find(b => b.textContent === lastName);
    if (btn) btn.click();
  }
})();
</script>
</body>
</html>
