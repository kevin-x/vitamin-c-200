<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찬조 현황 · 비타민C 200회</title>
<style>
  :root{
    --bg:#FFF6E9;
    --card:#ffffff;
    --line:#F0E0C3;
    --text:#2B2116;
    --sub:#8B7355;
    --accent:#FFD93D;
    --accent2:#B5603D;
    --mint:#FFFCF6;
    --dark:#2B1B12;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:linear-gradient(180deg,#FFF9EF 0%,#FFF1D8 100%);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  body{padding:18px}
  .wrap{max-width:560px;margin:0 auto}

  .home-btn{position:fixed;top:14px;left:14px;z-index:50;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--dark);color:var(--accent);font-size:14px;font-weight:800;text-decoration:none;box-shadow:0 6px 16px rgba(43,27,18,.25)}
  .home-btn:active{transform:scale(.97)}

  .poster{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 14px 36px rgba(90,60,20,.1)}
  .hero{padding:46px 28px 28px;background:
      radial-gradient(circle at top left, #FFFDF8 0, #FFFDF8 32%, transparent 33%),
      radial-gradient(circle at top right, #FFFDF8 0, #FFFDF8 32%, transparent 33%),
      linear-gradient(180deg,#FFF8E7 0%,#FFEFCE 100%);
    border-bottom:1px solid var(--line);
    text-align:center;position:relative}
  .leaf{position:absolute;font-size:20px;opacity:.6}
  .leaf.l1{left:26px;top:16px}.leaf.l2{right:28px;top:20px}
  .gift{font-size:40px;line-height:1}
  .title{font-size:30px;line-height:1.25;font-weight:900;letter-spacing:-1px;color:var(--dark);margin:10px 0 0}
  .badge{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:999px;background:var(--dark);color:var(--accent);font-size:14px;font-weight:800;letter-spacing:-.3px}
  .thanks{margin-top:14px;font-size:14px;color:var(--sub);font-weight:700;line-height:1.6}

  .list{padding:28px 22px 24px;display:flex;flex-direction:column;gap:16px}
  .card{border-radius:20px;border:1.5px solid var(--line);background:var(--mint);padding:20px 20px;box-shadow:0 4px 12px rgba(139,94,24,.06)}
  .card.gold{background:linear-gradient(135deg,#FFFBEB 0%,#FFF1C6 100%);border-color:var(--accent)}
  .who{display:flex;align-items:center;gap:10px}
  .who .avatar{font-size:26px}
  .who .name{font-size:21px;font-weight:900;letter-spacing:-.5px;color:var(--dark)}
  .items{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
  .items li{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text)}
  .items .emoji{font-size:17px;line-height:1}

  .footer{padding:8px 24px 28px;text-align:center}
  .footer-box{border-radius:22px;background:linear-gradient(180deg,#2B1B12 0%,#3D2817 100%);padding:22px 18px;border:1px solid #2B1B12}
  .footer-main{font-size:22px;font-weight:900;letter-spacing:-.5px;color:var(--accent)}
  .footer-sub{font-size:14px;color:#EDDFC9;font-weight:700;margin-top:8px;line-height:1.5}

  @media (max-width:480px){
    .title{font-size:25px}
  }
</style>
</head>
<body>
<a class="home-btn" href="index.html">← 홈</a>
<div class="wrap">
  <section class="poster">
    <div class="hero">
      <div class="leaf l1">🍁</div><div class="leaf l2">🍂</div>
      <div class="gift">🙏</div>
      <h1 class="title">고마운 마음<br>찬조 현황</h1>
      <div class="badge">200회 기념 · 1박2일 여행</div>
      <div class="thanks">선뜻 마음 보태주신 덕분에<br>더 풍성한 비타민C 200이 됩니다 💛</div>
    </div>

    <div class="list">
      <div class="card gold">
        <div class="who"><span class="avatar">🧑‍✈️</span><span class="name">케빈</span></div>
        <ul class="items">
          <li><span class="emoji">🎫</span> 상품권 20만원</li>
          <li><span class="emoji">🎁</span> 멤버 전체 선물 (20만원 상당)</li>
          <li><span class="emoji">🍷</span> 술(와인, 담금주)</li>
          <li><span class="emoji">🚗</span> 차량 운행 (톨비, 충전비)</li>
        </ul>
      </div>

      <div class="card">
        <div class="who"><span class="avatar">🚙</span><span class="name">써니</span></div>
        <ul class="items">
          <li><span class="emoji">⛽</span> 차량 운행 (톨비, 고급 휘발유)</li>
          <li><span class="emoji">🍾</span> 술 (수정방)</li>
        </ul>
      </div>

      <div class="card">
        <div class="who"><span class="avatar">💌</span><span class="name">헤이</span></div>
        <ul class="items">
          <li><span class="emoji">💵</span> 현금 8만원</li>
        </ul>
      </div>

      <div class="card">
        <div class="who"><span class="avatar">🍢</span><span class="name">알즈</span></div>
        <ul class="items">
          <li><span class="emoji">🍿</span> 안주</li>
        </ul>
      </div>
    </div>

    <div class="footer">
      <div class="footer-box">
        <div class="footer-main">모두 모두 감사합니다 🥰</div>
        <div class="footer-sub">여러분의 작은 마음들이 모여<br>200회의 울림이 됩니다.</div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
